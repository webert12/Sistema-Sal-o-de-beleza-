{% extends 'base.html' %}{% block content %}<section class="auth-shell"><div class="auth-card"><div class="brand"><div class="brand-icon">✂️</div><h1>Fio & Caixa</h1><p>Gestão financeira e agendamentos</p></div>{% if not initialized %}<a class="btn primary full" href="/setup">⚙️ Configurar primeiro acesso</a>{% else %}<form method="post" action="/login" id="loginForm"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="segmented"><button type="button" class="active" data-mode="salao">Salão</button><button type="button" data-mode="admin">Admin</button></div><input type="hidden" name="tipo" id="tipo" value="salao"><label>Usuário</label><input name="usuario" required autocomplete="username"><label>Senha</label><input type="password" name="senha" required autocomplete="current-password"><div id="adminSecond" class="hidden"><label>Senha secundária Admin</label><input type="password" name="senha2" autocomplete="current-password"></div><button class="btn primary full" type="submit">Acessar Sistema</button></form>{% if support_url %}<div class="auth-foot"><a href="{{support_url}}" target="_blank" rel="noopener">💬 Suporte</a></div>{% endif %}{% endif %}</div></section>{% endblock %}
