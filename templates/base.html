<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Fio&Caixa</title><link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body><main class="page">
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="toasts">{% for category,msg in messages %}<div class="toast {{category}}">{{msg}}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main><script src="/static/app.js"></script>{% block scripts %}{% endblock %}</body></html>
